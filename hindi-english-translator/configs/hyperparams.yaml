# SpeechBrain's Whisper wrapper with the multilingual small checkpoint.
language: hindi
sample_rate: 16000
whisper: !new:speechbrain.lobes.models.huggingface_transformers.whisper.Whisper
    source: openai/whisper-small
    save_path: .cache/whisper
    freeze: True
    freeze_encoder: True
    encoder_only: False
    language: !ref <language>
    task: transcribe
decoder: !new:speechbrain.decoders.seq2seq.S2SWhisperGreedySearcher
    model: !ref <whisper>
    min_decode_ratio: 0.0
    max_decode_ratio: 0.1
modules:
    whisper: !ref <whisper>
    decoder: !ref <decoder>

normalized_transcripts: False
